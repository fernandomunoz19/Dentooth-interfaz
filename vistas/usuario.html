  <body>
    <button class="Home">
      <img src="../Imagenes/Diente.png" alt="Home" />

    <main class="Contenido">
      <nav class="Menu-paciente">
        <h3>Paciente</h3>
        <ul>
          <li><a href="usuario.html">Agendar citas</a></li>
          <li><a href="Historia-clinica.html">Historia clinica</a></li>

      <form action="#" id="formCita">
        <h3>Agendar cita</h3>
        <div class="grupo-cita">
          <label for="Especialidad">Especialidad</label>
          <select name="Especialidad" id="Especialidad">
            <option value="general">Odontologia general</option>
            <option value="higiene">Fase higienica</option>
            <option value="rehabilitacion">Rehabilitacion</option>
            <option value="general">Primera vez</option>
            <option value="general">Control</option>
          </select>
        </div>

        <div class="grupo-cita">
          <label for="Fecha">Fecha</label>
          <input type="date" id="fechaCita" />
          <!-- Añadimos el id -->
        </div>

        <div class="grupo-cita">
          <label for="Hora">Hora</label>
          <input type="time" id="horaCita" />
        </div>

        <div class="grupo-cita">
          <label for="odontologo">Odontologo</label>
          <select name="odontologo" id="odontologo">
          <option value="">Selecciona un odontólogo</option> 
        </select>
      </div>

        <button type="submit" class="Agendar">Agendar</button>

      </form>
    </main>
